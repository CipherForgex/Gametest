
# MARBLE ATELIER — ANDROID APK BUILD
# Upload MARBLE_ATELIER_GAME.zip to the GitHub repository root.
# No need to extract the ZIP manually.

name: Build Marble Atelier APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'MARBLE_ATELIER_GAME.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Unzip, test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Check ZIP and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import zipfile
          import stat

          path = Path('MARBLE_ATELIER_GAME.zip')

          assert path.is_file(), \
              'Missing MARBLE_ATELIER_GAME.zip in repository root'

          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None, 'ZIP checksum failure'

              for item in z.infolist():
                  p = Path(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts, \
                      'Unsafe ZIP entry: ' + item.filename
                  assert not stat.S_ISLNK(item.external_attr >> 16), \
                      'ZIP must not contain symlinks'

              z.extractall('android-project')

          expected = Path('android-project/app/build.gradle')
          assert expected.is_file(), \
              'ZIP has incorrect folder structure'

          print('PASS: Project ZIP extracted successfully')
          PYCODE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Check project files
        working-directory: android-project
        run: python3 tools/check_project.py

      - name: Test game physics
        working-directory: android-project
        run: bash tools/test_physics.sh

      - name: Compile Android debug APK
        working-directory: android-project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and signature
        shell: bash
        run: |
          set -euo pipefail

          APK='android-project/app/build/outputs/apk/debug/app-debug.apk'

          test -s "$APK" || {
            echo 'ERROR: APK missing or empty'
            exit 1
          }

          unzip -tq "$APK"
          unzip -Z1 "$APK" > /tmp/marble-apk-entries.txt

          grep -x 'lib/arm64-v8a/libfilament-jni.so' \
            /tmp/marble-apk-entries.txt

          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" \
            verify --verbose "$APK"

          echo "APK verified successfully"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MARBLE_ATELIER_INSTALL_APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MARBLE_ATELIER_BUILD_REPORTS
          path: |
            android-project/app/build/reports/
            android-project/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
          
