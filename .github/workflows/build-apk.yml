name: Build Marble Atelier V0.6.0 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'MARBLE_ATELIER_V060_STUDIO.zip'
      - 'MARBLE_ATELIER_GAME.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Validate ZIP, test game, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and unzip complete Android project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile
          import stat

          game = next(
              (
                  p for p in (
                      Path('MARBLE_ATELIER_V060_STUDIO.zip'),
                      Path('MARBLE_ATELIER_GAME.zip')
                  )
                  if p.is_file()
              ),
              None
          )

          assert game is not None, 'Missing source ZIP in repository root'

          with ZipFile(game) as z:
              assert z.testzip() is None, 'Game ZIP is corrupt'

              for item in z.infolist():
                  p = Path(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts, 'Unsafe ZIP path'
                  assert not stat.S_ISLNK(item.external_attr >> 16), 'Symlinks not supported'

              z.extractall('android-project')

          root = Path('android-project')
          assert (root / 'app/build.gradle').is_file(), 'ZIP must contain project at root'
          assert (root / 'tools/test_visual_upgrade.py').is_file(), 'Missing visual regression tests'
          assert (root / 'handover/QA_REPORT.md').is_file(), 'Missing sprint documentation'

          print('PASS: ZIP extracted to android-project/')
          PYCODE

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Check source assets and Filament startup order
        working-directory: android-project
        run: python3 tools/check_project.py

      - name: Test all ten levels and collision rules
        working-directory: android-project
        run: bash tools/test_physics.sh

      - name: Test Graphics Lab feature switches
        working-directory: android-project
        run: bash tools/test_graphics.sh

      - name: Check studio scene, textures and rolling
        working-directory: android-project
        run: |
          python3 tools/test_visual_upgrade.py
          python3 tools/test_vnext_contracts.py
          bash tools/test_rolling.sh

      - name: Compile Android debug APK
        working-directory: android-project
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Verify APK and native Filament libraries
        shell: bash
        run: |
          set -euo pipefail

          APK='android-project/app/build/outputs/apk/debug/app-debug.apk'

          test -s "$APK" || {
            echo 'ERROR: APK missing or empty'
            exit 1
          }

          unzip -tq "$APK"
          unzip -Z1 "$APK" > /tmp/marble-apk-entries.txt

          grep -qx 'lib/arm64-v8a/libfilament-jni.so' /tmp/marble-apk-entries.txt
          grep -qx 'lib/arm64-v8a/libfilamat-jni.so' /tmp/marble-apk-entries.txt

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

          echo 'PASS: Signed Android debug APK verified'

      - name: Upload APK for your Samsung
        uses: actions/upload-artifact@v4
        with:
          name: MARBLE_ATELIER_V060_INSTALL_APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload QA and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MARBLE_ATELIER_V060_BUILD_LOGS
          path: |
            android-project/gradle-build.log
            android-project/handover/QA_REPORT.md
            android-project/handover/v050/QUALITY_PRESET_DIAGNOSTIC.md
            android-project/app/build/reports/
            android-project/app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 14
