
name: Marble Atelier v0.21.0 Cinematic Gallery Test APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Locate and validate canonical source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path, PurePosixPath
          import shutil, stat, zipfile

          repo = Path.cwd()
          out = repo / 'android-project'

          if (repo / 'app/build.gradle').is_file():
              shutil.copytree(
                  repo,
                  out,
                  ignore=shutil.ignore_patterns(
                      '.git', '.gradle', 'build', 'android-project'
                  )
              )
          else:
              archive = repo / 'MARBLE_ATELIER_V0210_CINEMATIC_STUDIO.zip'
              assert archive.is_file(), 'Upload MARBLE_ATELIER_V0210_CINEMATIC_STUDIO.zip to repository root'

              with zipfile.ZipFile(archive) as z:
                  assert z.testzip() is None, 'Corrupt source ZIP'

                  for member in z.infolist():
                      p = PurePosixPath(member.filename)
                      assert not p.is_absolute() and '..' not in p.parts and ':' not in member.filename and '\\' not in member.filename
                      assert not stat.S_ISLNK(member.external_attr >> 16), 'ZIP symlink rejected'

                  z.extractall(out)

          gradle = (out / 'app/build.gradle').read_text()

          assert "versionName '0.21.0'" in gradle and 'versionCode 46' in gradle, 'Wrong source version'
          assert (out / 'signing/atelier-development.keystore').is_file(), 'Missing stable test signing key'
          PYCODE

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Compile all chapter shaders with matching Filament compiler
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail https://github.com/google/filament/releases/download/v1.75.1/filament-v1.75.1-linux.tgz -o /tmp/filament-weather.tgz
          echo "cff34ebbeddcef0df903c4318c0540b0da843e01262ff2e896692a6ee2b5c925  /tmp/filament-weather.tgz" | sha256sum -c -
          mkdir -p /tmp/filament-weather
          tar -xzf /tmp/filament-weather.tgz -C /tmp/filament-weather filament/bin/matc
          MATC=/tmp/filament-weather/filament/bin/matc bash tools/compile_weather_shaders.sh

      - name: Run source and executable regression tests
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_project.py
          for test in tools/test*.py; do python3 "$test"; done
          for test in tools/test*.sh; do bash "$test"; done

      - name: Compile and lint
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug 2>&1 | tee gradle-build.log

      - name: Verify signed APK and both native architectures
        shell: bash
        run: |
          set -euo pipefail
          APK=android-project/app/build/outputs/apk/debug/app-debug.apk

          unzip -tq "$APK"
          unzip -Z1 "$APK" > /tmp/apk-files.txt

          for arch in arm64-v8a x86_64; do
            for lib in libfilament-jni.so libfilamat-jni.so; do
              grep -Fxq "lib/$arch/$lib" /tmp/apk-files.txt
            done
          done

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$APK"

          mkdir -p dist
          cp "$APK" dist/MARBLE_ATELIER_V0210_TEST.apk
          sha256sum dist/MARBLE_ATELIER_V0210_TEST.apk > dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MARBLE_ATELIER_V0210_TEST_APK
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MARBLE_ATELIER_V0210_QA_LOGS
          path: |
            android-project/gradle-build.log
            android-project/app/build/reports/
            android-project/handover/v0210/
          if-no-files-found: ignore
          
