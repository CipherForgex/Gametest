
name: Marble Atelier v0.9.5 - BlueStacks APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Find and extract v0.9.5 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile, BadZipFile
          import shutil
          import stat
          import sys

          root = Path.cwd()
          dest = root / "android-project"

          def correct_version(text):
              return (
                  "versionName '0.9.5'" in text
                  and "versionCode 19" in text
              )

          def is_project(folder):
              gradle = folder / "app/build.gradle"
              return (
                  (folder / "settings.gradle").is_file()
                  and gradle.is_file()
                  and correct_version(
                      gradle.read_text(errors="replace")
                  )
              )

          project = None

          for gradle in root.rglob("app/build.gradle"):
              if ".git" in gradle.parts:
                  continue
              if "android-project" in gradle.parts:
                  continue

              candidate = gradle.parent.parent

              if is_project(candidate):
                  project = candidate
                  break

          if project:
              shutil.copytree(
                  project,
                  dest,
                  ignore=shutil.ignore_patterns(
                      ".git",
                      ".gradle",
                      "build",
                      "android-project"
                  )
              )
              print("Found extracted Android project")

          else:
              selected = None

              for archive in sorted(root.rglob("*.zip")):
                  if ".git" in archive.parts:
                      continue

                  try:
                      with ZipFile(archive) as z:
                          names = set(z.namelist())

                          for name in names:
                              if not name.endswith(
                                  "app/build.gradle"
                              ):
                                  continue

                              prefix = name[:-len(
                                  "app/build.gradle"
                              )]

                              if (
                                  prefix + "settings.gradle"
                                  not in names
                              ):
                                  continue

                              text = z.read(name).decode(
                                  "utf-8", "replace"
                              )

                              if correct_version(text):
                                  selected = (archive, prefix)
                                  break

                  except (
                      BadZipFile,
                      OSError,
                      ValueError,
                      KeyError
                  ):
                      continue

                  if selected:
                      break

              if selected is None:
                  sys.exit(
                      "ERROR: Marble Atelier v0.9.5 "
                      "source ZIP is missing from GitHub. "
                      "Upload the latest source ZIP or "
                      "commit the extracted game project."
                  )

              archive, prefix = selected
              print("Using ZIP:", archive)

              with ZipFile(archive) as z:
                  if z.testzip() is not None:
                      sys.exit("ERROR: Corrupt ZIP")

                  for info in z.infolist():
                      name = info.filename
                      path = PurePosixPath(name)

                      if (
                          path.is_absolute()
                          or ".." in path.parts
                          or "\\" in name
                          or ":" in name
                          or stat.S_ISLNK(
                              info.external_attr >> 16
                          )
                      ):
                          sys.exit(
                              "ERROR: Unsafe ZIP member "
                              + name
                          )

                  dest.mkdir()

                  for info in z.infolist():
                      if not info.filename.startswith(
                          prefix
                      ):
                          continue

                      relative = info.filename[
                          len(prefix):
                      ]

                      if not relative:
                          continue

                      target = dest.joinpath(
                          *PurePosixPath(relative).parts
                      )

                      if info.is_dir():
                          target.mkdir(
                              parents=True,
                              exist_ok=True
                          )
                      else:
                          target.parent.mkdir(
                              parents=True,
                              exist_ok=True
                          )
                          with z.open(info) as src:
                              with target.open("wb") as out:
                                  shutil.copyfileobj(
                                      src, out
                                  )

          if not is_project(dest):
              sys.exit(
                  "ERROR: Wrong or incomplete "
                  "Android project"
              )

          required = (
              "tools/test_keyboard.sh",
              "tools/test_bluestacks_v095.py",
              "tools/check_project.py"
          )

          for file in required:
              if not (dest / file).is_file():
                  sys.exit("Missing: " + file)

          print("PASS: v0.9.5 project ready")
          PY

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Run game regression tests
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/check_project.py
          bash tools/test_physics.sh
          bash tools/test_graphics.sh
          python3 tools/test_visual_upgrade.py
          python3 tools/test_vnext_contracts.py
          python3 tools/test_harbour_v093.py
          bash tools/test_rolling.sh
          bash tools/test_tilt.sh
          bash tools/test_keyboard.sh
          python3 tools/test_bluestacks_v095.py

      - name: Build ARM64 and x86_64 APK
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            :app:assembleDebug \
            2>&1 | tee gradle-build.log

      - name: Verify APK compatibility
        shell: bash
        run: |
          set -euo pipefail

          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          unzip -tq "$APK"

          unzip -Z1 "$APK" > /tmp/apk-files.txt

          for arch in arm64-v8a x86_64; do
            for lib in libfilament-jni.so libfilamat-jni.so; do
              grep -Fxq \
                "lib/$arch/$lib" \
                /tmp/apk-files.txt || {
                  echo "Missing: $arch/$lib"
                  exit 1
                }
            done
          done

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify --verbose "$APK"

          mkdir -p dist

          cp "$APK" \
            dist/MARBLE_ATELIER_V095_BLUESTACKS.apk

          echo "PASS: Universal APK verified"

      - name: Upload BlueStacks APK
        uses: actions/upload-artifact@v4
        with:
          name: MARBLE_ATELIER_V095_BLUESTACKS_APK
          path: dist/MARBLE_ATELIER_V095_BLUESTACKS.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MARBLE_ATELIER_V095_BUILD_LOGS
          path: |
            android-project/gradle-build.log
            android-project/app/build/reports/
          if-no-files-found: ignore
          
