
# MARBLE ATELIER V0.4.1
# Phone-only GitHub APK builder
# Upload MARBLE_ATELIER_GAME.zip to repository root.
# Do not extract manually.

name: Build Marble Atelier APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'MARBLE_ATELIER_GAME.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Extract, test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and extract game ZIP
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYCODE'
          from pathlib import Path
          import stat
          import zipfile

          src = Path('MARBLE_ATELIER_GAME.zip')

          assert src.is_file(), \
              'MARBLE_ATELIER_GAME.zip missing from repository root'

          with zipfile.ZipFile(src) as z:
              assert z.testzip() is None, 'Corrupt game ZIP'

              for item in z.infolist():
                  p = Path(item.filename)

                  assert not p.is_absolute() and '..' not in p.parts, \
                      'Unsafe ZIP path'

                  assert not stat.S_ISLNK(item.external_attr >> 16), \
                      'Symlink not permitted'

              z.extractall('android-project')

          assert Path('android-project/app/build.gradle').is_file(), \
              'Incorrect ZIP root structure'

          assert Path(
              'android-project/tools/test_filament_startup.py'
          ).is_file(), 'Missing JNI startup test'

          print('PASS: Android source extracted')
          PYCODE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Test Filament native startup order
        working-directory: android-project
        run: python3 tools/test_filament_startup.py

      - name: Audit source files and textures
        working-directory: android-project
        run: python3 tools/check_project.py

      - name: Test all ten maze models
        working-directory: android-project
        run: bash tools/test_physics.sh

      - name: Compile Android APK
        working-directory: android-project
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Verify native libraries and APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK='android-project/app/build/outputs/apk/debug/app-debug.apk'

          test -s "$APK" || {
            echo 'APK missing or empty'
            exit 1
          }

          unzip -tq "$APK"

          unzip -Z1 "$APK" > /tmp/marble-apk-files.txt

          grep -qx 'lib/arm64-v8a/libfilament-jni.so' \
            /tmp/marble-apk-files.txt

          grep -qx 'lib/arm64-v8a/libfilamat-jni.so' \
            /tmp/marble-apk-files.txt

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify --verbose "$APK"

          echo 'PASS: APK verified'

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: MARBLE_ATELIER_INSTALL_APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MARBLE_ATELIER_FAILURE_DIAGNOSTICS
          path: |
            android-project/gradle-build.log
            android-project/app/build/reports/
            android-project/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
          
