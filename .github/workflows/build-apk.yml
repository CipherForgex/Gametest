
name: Marble Atelier v0.9.4 - Smart APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Find source, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Locate the Marble Atelier source automatically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile, BadZipFile
          import re
          import shutil
          import stat
          import sys

          repo = Path.cwd()
          output = repo / 'android-project'

          def is_v094(build_text):
              return (re.search(r'versionName\s+[\'"]0\.9\.4[\'"]', build_text)
                      and re.search(r'versionCode\s+18\b', build_text))

          # Accept an already-extracted Android project.
          projects = sorted(
              repo.rglob('settings.gradle'),
              key=lambda p: len(p.parts)
          )

          for settings in projects:
              folder = settings.parent

              if '.git' in folder.parts or 'android-project' in folder.parts:
                  continue

              gradle_file = folder / 'app/build.gradle'
              keyboard_file = (
                  folder /
                  'app/src/main/java/com/atelier/marble/KeyboardSteering.java'
              )

              if (gradle_file.is_file()
                      and keyboard_file.is_file()
                      and is_v094(
                          gradle_file.read_text(errors='replace')
                      )):
                  if folder != output:
                      shutil.copytree(
                          folder,
                          output,
                          ignore=shutil.ignore_patterns(
                              '.git', '.gradle', 'build'
                          )
                      )

                  print(
                      f'FOUND v0.9.4 source directory: '
                      f'{folder.relative_to(repo) or "."}'
                  )
                  break

          else:
              # Find ZIP files with any name, in any folder.
              archives = sorted(
                  (
                      p for p in repo.rglob('*')
                      if p.is_file()
                      and p.suffix.lower() == '.zip'
                      and '.git' not in p.parts
                      and 'android-project' not in p.parts
                  ),
                  key=lambda p: p.as_posix().lower()
              )

              print(
                  'ZIP files found:',
                  [str(p.relative_to(repo)) for p in archives]
              )

              selected = None

              for archive in archives:
                  try:
                      with ZipFile(archive) as z:
                          names = set(z.namelist())

                          for name in sorted(names, key=len):
                              if not name.endswith('settings.gradle'):
                                  continue

                              prefix = name[:-len('settings.gradle')]
                              gradle = prefix + 'app/build.gradle'
                              keyboard = (
                                  prefix +
                                  'app/src/main/java/com/atelier/marble/KeyboardSteering.java'
                              )

                              if (
                                  gradle in names
                                  and keyboard in names
                                  and is_v094(
                                      z.read(gradle).decode(
                                          'utf-8', 'replace'
                                      )
                                  )
                              ):
                                  selected = (archive, prefix)
                                  break

                  except (
                      BadZipFile,
                      OSError,
                      KeyError,
                      ValueError
                  ) as err:
                      print(
                          f'Skipping invalid ZIP {archive}: {err}'
                      )

                  if selected:
                      break

              if selected is None:
                  print(
                      '::error::No Marble Atelier v0.9.4 '
                      '(build 18) source found.'
                  )
                  print(
                      'Upload the v0.9.4 Android source ZIP '
                      'to this GitHub repository.'
                  )
                  print(
                      'Any ZIP name or folder is supported.'
                  )
                  print(
                      'You can also commit the extracted '
                      'Android project files.'
                  )
                  print(
                      'A workflow cannot compile an APK '
                      'without the actual project source.'
                  )
                  sys.exit(1)

              archive, prefix = selected

              print(
                  f'FOUND source ZIP: '
                  f'{archive.relative_to(repo)}'
              )

              with ZipFile(archive) as z:
                  assert z.testzip() is None, (
                      'Source ZIP has a corrupt member'
                  )

                  for info in z.infolist():
                      name = info.filename
                      p = PurePosixPath(name)

                      if (
                          p.is_absolute()
                          or '..' in p.parts
                          or '\\' in name
                          or ':' in name
                      ):
                          raise ValueError(
                              f'Unsafe path in archive: {name}'
                          )

                      if stat.S_ISLNK(
                          info.external_attr >> 16
                      ):
                          raise ValueError(
                              f'Symlink not supported: {name}'
                          )

                  output.mkdir(exist_ok=False)

                  for info in z.infolist():
                      if not info.filename.startswith(prefix):
                          continue

                      relative = info.filename[len(prefix):]

                      if not relative:
                          continue

                      dest = output.joinpath(
                          *PurePosixPath(relative).parts
                      )

                      if info.is_dir():
                          dest.mkdir(
                              parents=True,
                              exist_ok=True
                          )
                      else:
                          dest.parent.mkdir(
                              parents=True,
                              exist_ok=True
                          )

                          with z.open(info) as source:
                              with dest.open('wb') as target:
                                  shutil.copyfileobj(
                                      source, target
                                  )

          required_files = (
              'settings.gradle',
              'app/build.gradle',
              'tools/check_project.py',
              'tools/test_physics.sh',
              'tools/test_keyboard.sh'
          )

          for required in required_files:
              if not (output / required).is_file():
                  sys.exit(
                      f'::error::Incomplete game project: '
                      f'missing {required}'
                  )

          print(
              'PASS: Correct v0.9.4 project ready'
          )
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Run project graphics physics and keyboard checks
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/check_project.py
          bash tools/test_physics.sh
          bash tools/test_graphics.sh
          python3 tools/test_visual_upgrade.py
          python3 tools/test_vnext_contracts.py
          python3 tools/test_harbour_v093.py
          bash tools/test_rolling.sh
          bash tools/test_tilt.sh
          bash tools/test_keyboard.sh

      - name: Build Android APK
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            :app:assembleDebug \
            2>&1 | tee gradle-build.log

      - name: Verify APK is present and signed
        shell: bash
        run: |
          set -euo pipefail

          APK=android-project/app/build/outputs/apk/debug/app-debug.apk

          test -s "$APK"

          unzip -tq "$APK"

          unzip -Z1 "$APK" > /tmp/marble-apk-files.txt

          grep -Fxq \
            'lib/arm64-v8a/libfilament-jni.so' \
            /tmp/marble-apk-files.txt

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify --verbose "$APK"

          echo 'PASS: Compiled signed APK verified'

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MARBLE_ATELIER_V094_WASD_APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MARBLE_ATELIER_V094_BUILD_LOGS
          path: |
            android-project/gradle-build.log
            android-project/app/build/reports/
            android-project/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14
          
